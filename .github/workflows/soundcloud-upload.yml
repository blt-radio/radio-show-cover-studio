name: SoundCloud upload

on:
  workflow_dispatch:
    inputs:
      audio_file_id:
        description: Google Drive file id of the audio
        required: true
      image_file_id:
        description: Google Drive file id of the square artwork (optional)
        required: false
        default: ""
      title:
        required: true
      tags:
        required: false
        default: ""
      description:
        required: false
        default: ""

# One upload at a time: SoundCloud refresh tokens are single-use, so two
# simultaneous runs would invalidate each other's token.
concurrency:
  group: soundcloud-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stream Drive -> SoundCloud
        run: node scripts/soundcloud-upload.mjs
        env:
          AUDIO_FILE_ID: ${{ inputs.audio_file_id }}
          IMAGE_FILE_ID: ${{ inputs.image_file_id }}
          TRACK_TITLE: ${{ inputs.title }}
          TRACK_TAGS: ${{ inputs.tags }}
          TRACK_DESCRIPTION: ${{ inputs.description }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          SOUNDCLOUD_CLIENT_SECRET: ${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
          SOUNDCLOUD_SHARING: ${{ vars.SOUNDCLOUD_SHARING || 'private' }}
